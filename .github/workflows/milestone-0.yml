name: Milestone 0

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version

      - name: Fetch locked standards and tools
        run: ./raaml sources fetch

      - name: Verify locked source bytes
        run: ./raaml sources verify

      - name: Bootstrap pinned tool adapters
        run: ./raaml tooling bootstrap

      - name: Validate repository schemas
        run: ./raaml schemas validate

      - name: Run dependency-free unit tests
        run: ./raaml tests unit

      - name: Run paired Milestone 0 fixtures
        run: ./raaml tests milestone-0
