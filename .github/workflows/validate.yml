name: RAAML preservation validation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Define build identity
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          short_commit="${commit:0:12}"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            tagged_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
            if [[ "$tagged_commit" != "$commit" ]]; then
              echo "Tag $GITHUB_REF_NAME does not point to $commit" >&2
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
            release_dir="raaml-$GITHUB_REF_NAME"
            build_label="Tagged candidate $GITHUB_REF_NAME"
          else
            release_tag="v0.0.0-dev.$short_commit"
            release_dir="raaml-development-$short_commit"
            build_label="Development build $short_commit"
          fi

          {
            echo "RAAML_GIT_COMMIT=$commit"
            echo "RAAML_RELEASE_TAG=$release_tag"
            echo "RAAML_RELEASE_DIR_NAME=$release_dir"
            echo "RAAML_BUILD_LABEL=$build_label"
          } >> "$GITHUB_ENV"

      - name: Audit conservative publication boundary
        run: ./raaml publication audit

      - name: Install pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Fetch locked standards and tools
        run: ./raaml sources fetch

      - name: Verify locked source bytes
        run: ./raaml sources verify

      - name: Bootstrap pinned tool adapters
        run: ./raaml tooling bootstrap

      - name: Validate repository schemas
        run: ./raaml schemas validate

      - name: Audit official transformation citations
        run: |
          ./raaml transformation surface
          ./raaml transformation properties
          ./raaml transformation constraints
          ./raaml transformation audit --require-resolved
          ./raaml validate-v2 fixtures/milestone-2/resolved-carriers.sysml

      - name: Run dependency-free unit tests
        run: ./raaml tests unit

      - name: Run paired validator fixtures
        run: ./raaml tests milestone-0

      - name: Extract and audit canonical facts
        run: |
          ./raaml facts extract --all --check-determinism
          ./raaml oracle audit --all
          ./raaml validate-ocl --all
          ./raaml tests milestone-1

      - name: Run thin vertical slice
        run: ./raaml tests milestone-3

      - name: Generate and validate full v2 corpus
        run: ./raaml tests milestone-4

      - name: Reconstruct and validate full v1 corpus
        run: ./raaml tests milestone-5

      - name: Run full conformance and adversarial suite
        run: ./raaml tests milestone-6

      - name: Run native TypeScript conformance tests
        run: |
          npm ci --prefix typescript
          npm test --prefix typescript

      - name: Verify installable TypeScript package
        run: |
          package_dir="$(mktemp -d)"
          tarball_name="$(
            npm pack ./typescript \
              --pack-destination "$package_dir" \
              --silent
          )"
          tarball="$package_dir/$tarball_name"

          tar -tzf "$tarball" | grep -qx "package/LICENSE"
          tar -tzf "$tarball" | grep -qx "package/NOTICE"
          tar -tzf "$tarball" | grep -qx "package/README.md"
          tar -tzf "$tarball" | grep -qx "package/dist/index.js"
          tar -tzf "$tarball" | grep -qx "package/dist/index.d.ts"

          if tar -tzf "$tarball" |
            grep -E 'package/(src/|dist/.*\.test\.(js|d\.ts)$)'
          then
            echo "Package contains source or test files that must not be published."
            exit 1
          fi

          mkdir "$package_dir/consumer"
          cd "$package_dir/consumer"
          npm init -y
          npm install "$tarball" --ignore-scripts
          node --input-type=module -e \
            "const m = await import('@florian-zeev/raaml-sysml-v2-preservation'); if (typeof m.forward !== 'function' || typeof m.reverse !== 'function') process.exit(1)"

      - name: Build digest-identified validation container
        run: |
          docker build \
            --pull \
            --no-cache \
            --platform linux/amd64 \
            --build-arg VCS_REF="$RAAML_GIT_COMMIT" \
            --build-arg SOURCE_STATE=clean \
            --tag raaml-preservation:validation \
            .
          image_id="$(
            docker image inspect \
              --format '{{.Id}}' \
              raaml-preservation:validation
          )"
          echo "Container image ID: $image_id"
          echo "RAAML_CONTAINER_DIGEST=$image_id" >> "$GITHUB_ENV"
          {
            echo "### RAAML preservation container"
            echo
            echo "- Build: $RAAML_BUILD_LABEL"
            echo "- Git commit: \`$RAAML_GIT_COMMIT\`"
            echo "- Image ID: \`$image_id\`"
            echo "- Target platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reproduce validation package on host
        run: |
          ./raaml reproduce \
            --clean \
            --container-digest "$RAAML_CONTAINER_DIGEST" \
            --release-tag "$RAAML_RELEASE_TAG" \
            --output-dir release-host \
            --diagnostics reports/diagnostics/reproduce-host.json

      - name: Exercise container offline
        run: |
          chmod -R a+rX sources/cache
          mkdir -p container-evidence
          chmod 777 container-evidence
          mkdir -p release-container
          chmod 777 release-container
          docker run \
            --rm \
            --network none \
            --platform linux/amd64 \
            --env RAAML_CONTAINER_DIGEST="$RAAML_CONTAINER_DIGEST" \
            --env RAAML_RELEASE_TAG="$RAAML_RELEASE_TAG" \
            --env RAAML_RELEASE_DIR_NAME="$RAAML_RELEASE_DIR_NAME" \
            --volume "$PWD/sources/cache:/workspace/sources/cache:ro" \
            --volume "$PWD/container-evidence:/evidence" \
            --volume "$PWD/release-container:/release" \
            raaml-preservation:validation \
            sh -ec '
              ./raaml sources verify
              ./raaml tooling bootstrap
              ./raaml schemas validate
              ./raaml transformation surface \
                --output /evidence/corpus-transformation-surface.json
              ./raaml transformation properties \
                --output /evidence/property-transformation-surface.json
              ./raaml transformation constraints \
                --output /evidence/constraint-transformation-surface.json
              ./raaml transformation audit --require-resolved
              ./raaml validate-v2 \
                fixtures/milestone-2/resolved-carriers.sysml
              ./raaml tests unit
              ./raaml tests milestone-0
              ./raaml facts extract \
                --all \
                --check-determinism \
                --raw-output /evidence/raw-raaml-facts.json \
                --canonical-output /evidence/canonical-raaml-facts.json \
                --diagnostics /evidence/facts-extract.json
              ./raaml oracle audit \
                --all \
                --output /evidence/corpus-audit.json
              ./raaml validate-ocl \
                --all \
                --diagnostics /evidence/validate-ocl.json
              ./raaml tests milestone-1 \
                --diagnostics /evidence/tests-milestone-1.json
              ./raaml tests milestone-3 \
                --output /evidence/milestone-3.json \
                --diagnostics /evidence/tests-milestone-3.json
              ./raaml tests milestone-4 \
                --output /evidence/milestone-4.json \
                --diagnostics /evidence/tests-milestone-4.json
              ./raaml tests milestone-5 \
                --output /evidence/milestone-5.json \
                --diagnostics /evidence/tests-milestone-5.json
              ./raaml tests milestone-6 \
                --output /evidence/milestone-6.json \
                --comparison-output \
                  /evidence/milestone-6-comparison.json \
                --diagnostics /evidence/tests-milestone-6.json
              ./raaml reproduce \
                --clean \
                --container-digest "$RAAML_CONTAINER_DIGEST" \
                --release-tag "$RAAML_RELEASE_TAG" \
                --output-dir "/release/$RAAML_RELEASE_DIR_NAME" \
                --diagnostics /evidence/reproduce-container.json
            '

      - name: Compare host and container evidence
        run: |
          cmp \
            reports/facts/canonical-raaml-facts.json \
            container-evidence/canonical-raaml-facts.json
          cmp \
            reports/transformation/corpus-surface.json \
            container-evidence/corpus-transformation-surface.json
          cmp \
            reports/transformation/property-surface.json \
            container-evidence/property-transformation-surface.json
          cmp \
            reports/transformation/constraint-surface.json \
            container-evidence/constraint-transformation-surface.json
          cmp \
            reports/conformance/milestone-3.json \
            container-evidence/milestone-3.json
          cmp \
            reports/conformance/milestone-4.json \
            container-evidence/milestone-4.json
          cmp \
            reports/conformance/milestone-5.json \
            container-evidence/milestone-5.json
          cmp \
            reports/conformance/milestone-6.json \
            container-evidence/milestone-6.json
          cmp \
            reports/conformance/milestone-6-comparison.json \
            container-evidence/milestone-6-comparison.json
          diff -qr \
            release-host \
            "release-container/$RAAML_RELEASE_DIR_NAME"
          (
            cd release-host
            sha256sum --check SHA256SUMS
          )
          (
            cd "release-container/$RAAML_RELEASE_DIR_NAME"
            sha256sum --check SHA256SUMS
          )

          canonical_sha="$(
            sha256sum reports/facts/canonical-raaml-facts.json |
            cut -d ' ' -f 1
          )"
          differences="$(
            jq -r '.summary.differences' \
              reports/conformance/milestone-6.json
          )"
          cases="$(
            jq -r '.summary.adversarialCases' \
              reports/conformance/milestone-6.json
          )"
          failures="$(
            jq -r '.summary.failedAdversarialCases' \
              reports/conformance/milestone-6.json
          )"
          v1_errors="$(
            jq -r '.summary.v1ValidationErrors' \
              reports/conformance/milestone-6.json
          )"
          v2_errors="$(
            jq -r '.summary.v2ValidationErrors' \
              reports/conformance/milestone-6.json
          )"
          native_targets="$(
            jq -r '.summary.nativeTargets' \
              reports/conformance/milestone-4.json
          )"
          release_files="$(wc -l < release-host/SHA256SUMS)"

          {
            echo "### Consolidated validation result"
            echo
            echo "- Build: $RAAML_BUILD_LABEL"
            echo "- Canonical SHA-256: \`$canonical_sha\`"
            echo "- Source and reconstructed artifacts: 17 / 17"
            echo "- Canonical fact differences: $differences"
            echo "- SysML v1 validation errors: $v1_errors"
            echo "- SysML v2 validation errors: $v2_errors"
            echo "- OCL expressions parsed and resolved: 33"
            echo "- Transformation decisions: 35 resolved / 0 open"
            echo "- Native v2 targets: $native_targets"
            echo "- Adversarial cases: $cases"
            echo "- Failed adversarial cases: $failures"
            echo "- Native TypeScript canonical equality gate: passed"
            echo "- Release files: $release_files"
            echo "- Host/container comparison: identical"
          } >> "$GITHUB_STEP_SUMMARY"
